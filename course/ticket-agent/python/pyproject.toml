[project]
name = "ticket-agent"
version = "0.1.0"
description = "企业知识库与工单 Agent 的 Python 最小移植（仅标准库）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ticket-agent = "ticket_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ticket_agent"]
