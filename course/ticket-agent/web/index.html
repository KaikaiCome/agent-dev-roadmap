<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业知识库与工单 Agent</title>
    <style>
      body { margin: 0; font: 15px/1.6 system-ui, sans-serif; background: #f6f7f9; color: #1f2328; }
      .wb { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      textarea { width: 100%; box-sizing: border-box; min-height: 64px; font: inherit; padding: 8px; }
      button { font: inherit; padding: 6px 14px; cursor: pointer; }
      .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; margin: 10px 0; }
      .tool { font-size: 13px; color: #57606a; }
      .approval { border-color: #bf8700; background: #fff8c5; }
      .answer { white-space: pre-wrap; }
      .error { color: #cf222e; }
      pre { white-space: pre-wrap; margin: 6px 0 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
